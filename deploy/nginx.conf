server {
    listen 80;
    listen [::]:80;
    server_name exam.example.com;

    # 正式上线后应由 HTTPS server 接管，并将 HTTP 301 跳转到 HTTPS。
    root /var/www/cyber-assessment-platform/public;
    index index.php;
    charset utf-8;
    client_max_body_size 32m;

    access_log /var/log/nginx/cyber-exam.access.log;
    error_log  /var/log/nginx/cyber-exam.error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    # 除 index.php 外，不允许从 Web 直接执行任何 PHP 文件。
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    location ~* \.(css|js|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}

